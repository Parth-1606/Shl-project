services:
  - type: web
    name: shl-recommendation-agent
    runtime: python
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python -m app.catalog.build_embeddings"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # Requires manual entry in Render Dashboard
      - key: PYTHON_VERSION
        value: "3.11.9"
